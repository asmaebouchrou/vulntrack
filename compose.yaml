services:
  db:
    image: postgres:17
    container_name: vulntrack-db
    environment:
      POSTGRES_DB: vulntrack
      POSTGRES_USER: vulntrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scan_history_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulntrack -d vulntrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scan_history_data:
